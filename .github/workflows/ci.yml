name: AI Sana CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-sana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and SQLite migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AI_MODE: mock
      ANTHROPIC_API_KEY: ""
      DATABASE_URL: sqlite:///./ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check migrations and repeatable seed
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed
          python -m app.seed
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: TypeScript and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    name: Docker and PostgreSQL demo flow
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_MODE: mock
      ANTHROPIC_API_KEY: ""
      DEMO_ACCESS_CODE: ""
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start isolated demo containers
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check PostgreSQL schema and repeatable seed
        run: |
          docker compose exec -T backend alembic check
          docker compose exec -T backend python -m app.seed
      - name: Check UI, proxy, anonymity, winner and points
        run: python3 scripts/smoke_demo.py http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove isolated CI containers and data
        if: always()
        run: docker compose down --volumes
