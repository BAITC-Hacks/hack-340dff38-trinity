<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Демонстрационный прототип учёта заказов</title><link rel="stylesheet" href="styles.css"><body style="padding:40px"><main style="max-width:850px;margin:auto"><a href="./">← Вернуться в Qadam</a><h1>Заказы ателье</h1><p class="muted">Общий синтетический пример прототипа для демонстрационных предложений. Не является результатом работы реальной команды.</p><div class="panel"><h2>Новый заказ</h2><form id="orders"><label>Изделие<input name="item" required placeholder="Например: подшить брюки"></label><label>Срок<input name="date" type="date" required></label><button class="primary">Добавить заказ</button></form></div><div id="rows" class="panel" style="margin-top:20px"></div></main><script>const entries=[{item:'Подшить платье',date:'2026-10-10',done:false}];function draw(){const root=document.getElementById('rows');root.replaceChildren();entries.forEach((entry,i)=>{const row=document.createElement('div');row.className='spread';row.style.padding='15px';const text=document.createElement('span');text.textContent=entry.item+' · '+entry.date;const button=document.createElement('button');button.textContent=entry.done?'Готово':'В работе';button.onclick=()=>{entry.done=!entry.done;draw()};row.append(text,button);root.append(row)});}document.getElementById('orders').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);entries.push({item:f.get('item'),date:f.get('date'),done:false});e.target.reset();draw()};draw();</script></body></html>
